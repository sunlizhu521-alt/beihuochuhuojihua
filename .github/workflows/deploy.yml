name: Deploy Backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'sunlizhu521-alt/beihuochuhuojihua'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Package source
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='data' \
            --exclude='dist' \
            -czf "$RUNNER_TEMP/beihuochuhuojihua.tar.gz" .

      - name: Upload package
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p /home/ubuntu/zhuge-ai-lab/beihuochuhuojihua /tmp/beihuochuhuojihua-deploy"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$RUNNER_TEMP/beihuochuhuojihua.tar.gz" \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/beihuochuhuojihua-deploy/beihuochuhuojihua.tar.gz

      - name: Deploy and verify
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -Eeuo pipefail

            APP_DIR=/home/ubuntu/zhuge-ai-lab/beihuochuhuojihua
            ARCHIVE=/tmp/beihuochuhuojihua-deploy/beihuochuhuojihua.tar.gz
            BACKUP_DIR=/home/ubuntu/backups/beihuochuhuojihua
            APP_NAME=beihuochuhuojihua
            APP_PORT=4009

            mkdir -p "$APP_DIR" "$BACKUP_DIR"

            if ! pm2 describe "$APP_NAME" >/dev/null 2>&1 && command -v lsof >/dev/null 2>&1; then
              LISTENER_PID=$(lsof -t -iTCP:"$APP_PORT" -sTCP:LISTEN 2>/dev/null | head -n 1 || true)
              if [ -n "$LISTENER_PID" ]; then
                echo "Port $APP_PORT is already owned by PID $LISTENER_PID; deployment stopped without changing it."
                exit 1
              fi
            fi

            if [ -s "$APP_DIR/data/gendanjindu.sqlite" ]; then
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              BACKUP_FILE="$BACKUP_DIR/gendanjindu-$TIMESTAMP.sqlite.gz"
              gzip -c "$APP_DIR/data/gendanjindu.sqlite" > "$BACKUP_FILE.tmp"
              gzip -t "$BACKUP_FILE.tmp"
              mv "$BACKUP_FILE.tmp" "$BACKUP_FILE"
              ls -lh "$BACKUP_FILE"
            fi

            tar -xzf "$ARCHIVE" -C "$APP_DIR"
            cd "$APP_DIR"
            npm ci
            export VITE_API_BASE_URL=/beihuochuhuojihua-api
            npm run build

            export PORT="$APP_PORT"
            export DATA_DIR="$APP_DIR/data"
            pm2 startOrRestart ecosystem.config.cjs --only "$APP_NAME" --update-env

            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$APP_PORT/api/bootstrap" >/dev/null \
                && curl -fsS "http://127.0.0.1:$APP_PORT/beihuochuhuojihua/" >/dev/null; then
                break
              fi
              if [ "$attempt" = 30 ]; then
                pm2 logs "$APP_NAME" --lines 100 --nostream
                exit 1
              fi
              sleep 2
            done

            pm2 save
            pm2 describe "$APP_NAME"
            rm -f "$ARCHIVE"
          EOF
